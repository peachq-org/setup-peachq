name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  action:
    name: action ${{ matrix.version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        version: [0.92.20261116, 0.92.20261115, v0.92, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pq
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: the exports agree and q reports the requested version
        env:
          REQUESTED: ${{ matrix.version }}
          Q_PATH: ${{ steps.pq.outputs.q-path }}
          Q_VERSION: ${{ steps.pq.outputs.version }}
        run: test/check-install.sh
      - run: test/smoke.sh

  add-to-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          version: 0.92.20261116
          add-to-path: 'true'
      - run: '[ "$(command -v q)" = "$PEACHQ_Q" ]'

  args:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          version: 0.92.20261116
          add-to-path: 'true'
          args: -classic it's
      - run: test/args.sh
      - id: alone
        continue-on-error: true
        uses: ./
        with:
          version: 0.92.20261116
          args: -classic
      - name: args without add-to-path is refused
        run: '[ "${{ steps.alone.outcome }}" = failure ]'

  duckdb:
    name: duckdb on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: std
        uses: ./
        with:
          version: 0.92.20261118
      - id: pq
        uses: ./
        with:
          version: 0.92.20261118
          duckdb: 'true'
      - name: the DuckDB build installs beside the standard one, not over it
        env:
          REQUESTED: 0.92.20261118
          STD: ${{ steps.std.outputs.q-path }}
          Q_PATH: ${{ steps.pq.outputs.q-path }}
          Q_VERSION: ${{ steps.pq.outputs.version }}
        run: |
          test/check-install.sh
          [ "$STD" != "$Q_PATH" ]
          unix() { cygpath -u "$1" 2> /dev/null || printf '%s' "$1"; }
          grep -x duckdb=true "$(dirname "$(unix "$Q_PATH")")/.peachq-install"
          grep -x duckdb=false "$(dirname "$(unix "$STD")")/.peachq-install"
      - run: test/smoke.sh
      - run: '"$QCMD" test/duckdb.q < /dev/null'
      - id: site
        continue-on-error: true
        uses: ./
        with:
          version: 0.92.20261118
          duckdb: 'true'
          dist-url: https://peachq.org/file
      - name: peachq.org has no pinned DuckDB build, and says so
        run: '[ "${{ steps.site.outcome }}" = failure ]'

  peachq-org:
    name: action from peachq.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pq
        uses: ./
        with:
          version: 0.92.20261116
          dist-url: https://peachq.org/file
      - name: the build came from peachq.org
        env:
          REQUESTED: 0.92.20261116
          Q_PATH: ${{ steps.pq.outputs.q-path }}
          Q_VERSION: ${{ steps.pq.outputs.version }}
        run: |
          test/check-install.sh
          grep -x 'source=https://peachq.org/file' "$(dirname "$PEACHQ_Q")/.peachq-install"

  install-sh:
    name: install.sh without the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/install-sh.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pq
        uses: ./
        with:
          version: 0.92.20261118
          add-to-path: 'true'
          args: -classic it's
      - env:
          REQUESTED: 0.92.20261118
          Q_PATH: ${{ steps.pq.outputs.q-path }}
          Q_VERSION: ${{ steps.pq.outputs.version }}
        run: test/check-install.sh
      - run: test/smoke.sh
      - run: test/args.sh
      - run: test/install-sh.sh
      - name: QCMD and the q shim from PowerShell
        shell: pwsh
        run: |
          & $env:QCMD -e 0; if ($LASTEXITCODE) { exit 1 }
          & $env:QCMD test/smoke.q; if ($LASTEXITCODE) { exit 1 }
          $out = (q test/args.q xx -y) -join '|'
          if ($out -ne '"xx"|"-y"|"it''s"|a|-|1|2') { "q shim printed: $out"; exit 1 }
      - name: QCMD and the q shim from cmd
        shell: cmd
        run: |
          "%QCMD%" -e 0 || exit /b 1
          call q test\smoke.q || exit /b 1
      - name: a JVM launches QCMD
        working-directory: test
        run: java Launch.java

  # The one macOS job: nightly, on demand and on release tags, not on every pull request.
  macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pq
        uses: ./
        with:
          version: 0.92.20261116
          add-to-path: 'true'
          args: -classic it's
      - env:
          REQUESTED: 0.92.20261116
          Q_PATH: ${{ steps.pq.outputs.q-path }}
          Q_VERSION: ${{ steps.pq.outputs.version }}
        run: test/check-install.sh
      - run: test/smoke.sh
      - run: test/args.sh
      - run: test/install-sh.sh
      - uses: ./
        with:
          version: 0.92.20261118
          duckdb: 'true'
      - run: '"$QCMD" test/duckdb.q < /dev/null'
