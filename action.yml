name: Set up peachq
description: Install a pinned peachq release, checksum-verified, and export its q as QCMD and PEACHQ_Q.
author: peachq-org
branding:
  icon: download
  color: orange

inputs:
  version:
    description: >-
      The peachq to install: an exact build such as 0.92.20261116 (recommended), a release tag such as v0.92,
      or latest. Required, so a workflow never changes engine without a commit.
    required: true
  dist-url:
    description: >-
      Download from https://peachq.org/file, or from your own mirror with its flat layout
      (<dist-url>/peachq-v<version>-<platform>.tar.gz and .sha256), instead of GitHub Releases.
    required: false
    default: ''
  add-to-path:
    description: >-
      Put peachq's directory on PATH as `q` (on Windows, for bash, cmd and PowerShell alike). Off by default so nothing mistakes peachq for another q.
    required: false
    default: 'false'
  duckdb:
    description: >-
      Install the larger build with DuckDB bundled beside q (s) SQL, Parquet, s3:// and Kafka, offline). Releases
      from v0.91 have it for every platform, on GitHub Releases only.
    required: false
    default: 'false'
  args:
    description: >-
      With add-to-path, extra arguments the `q` on PATH appends after the caller's own, such as -classic, for
      projects whose own scripts call plain q. Split on whitespace; no quoting or globbing. On Windows a
      word cannot contain a double quote. QCMD and PEACHQ_Q still
      name the real binary.
    required: false
    default: ''

outputs:
  q-path:
    description: Absolute path of the installed q (on Windows, q.exe as a C:\ path).
    value: ${{ steps.install.outputs.q-path }}
  version:
    description: The installed build, as .pq.version reports it (e.g. 0.92.20261116).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIST: ${{ inputs.dist-url }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
        ARGS: ${{ inputs.args }}
        DUCKDB: ${{ inputs.duckdb }}
      run: |
        [ -n "$VERSION" ] || { echo "::error::setup-peachq: the version input is required"; exit 1; }
        [ -z "${ARGS//[[:space:]]/}" ] || [ "$ADD_TO_PATH" = true ] ||
          { echo "::error::setup-peachq: args puts a q shim on PATH, so it needs add-to-path: true"; exit 1; }
        case $DUCKDB in true) flavour=-duckdb ;; false) flavour= ;; *) echo "::error::setup-peachq: duckdb is '$DUCKDB', not true or false"; exit 1 ;; esac
        exact=false
        [[ $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]{8}$ ]] && exact=true
        src=$(printf '%s' "${DIST:-github}" | { sha256sum 2> /dev/null || shasum -a 256; } | cut -c1-12)
        {
          echo "exact=$exact"
          echo "dir=$RUNNER_TOOL_CACHE/peachq/$VERSION/$RUNNER_OS-$RUNNER_ARCH$flavour"
          echo "key=setup-peachq-1-$VERSION-$RUNNER_OS-$RUNNER_ARCH$flavour-$src"
        } >> "$GITHUB_OUTPUT"

    # Only an exact build is cached: a tag or latest can move, so it is always fetched afresh.
    - if: steps.plan.outputs.exact == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.dir }}
        key: ${{ steps.plan.outputs.key }}

    - id: install
      shell: bash
      env:
        PEACHQ_VERSION: ${{ inputs.version }}
        PEACHQ_DIST_URL: ${{ inputs.dist-url }}
        PEACHQ_INSTALL_DIR: ${{ steps.plan.outputs.dir }}
        PEACHQ_DUCKDB: ${{ inputs.duckdb }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
        ARGS: ${{ inputs.args }}
        GH_TOKEN: ${{ github.token }}
      run: |
        q=$("$GITHUB_ACTION_PATH/install.sh")
        dir=$(dirname "$q")
        version=$(sed -n 's/^version=//p' "$dir/.peachq-install")
        shim=$RUNNER_TEMP/setup-peachq-args
        # Native Windows processes (cmd, PowerShell, a JVM) cannot launch an MSYS path such as /c/...
        if [ "$RUNNER_OS" = Windows ]; then q=$(cygpath -w "$q"); dir=$(cygpath -w "$dir"); shim=$(cygpath -w "$shim"); fi
        echo "q-path=$q" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        { echo "QCMD=$q"; echo "PEACHQ_Q=$q"; } >> "$GITHUB_ENV"
        read -ra words -d "" <<< "$ARGS" || true
        if [ ${#words[@]} -gt 0 ]; then
          mkdir -p "$shim"
          sq() { printf "'%s'" "$(printf %s "$1" | sed "s/'/'\\\\''/g")"; }
          line="exec $(sq "$q") \"\$@\""
          for w in "${words[@]}"; do line+=" $(sq "$w")"; done
          printf '#!/bin/sh\n%s\n' "$line" > "$shim/q"
          chmod +x "$shim/q"
          if [ "$RUNNER_OS" = Windows ]; then
            line="@\"$q\" %*"
            for w in "${words[@]}"; do
              case $w in *'"'*) echo "::error::setup-peachq: on Windows an args word cannot contain a double quote: $w"; exit 1 ;; esac
              line+=" \"${w//%/%%}\""
            done
            printf '%s\r\n' "$line" '@exit /b %ERRORLEVEL%' > "$shim/q.cmd"
          fi
          echo "$shim" >> "$GITHUB_PATH"
          echo "q on PATH appends ${words[*]}: $shim/q"
        elif [ "$ADD_TO_PATH" = true ]; then
          echo "$dir" >> "$GITHUB_PATH"
        fi
        echo "peachq $version: $q"
