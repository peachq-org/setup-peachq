name: Set up peachq
description: Install a pinned peachq release, checksum-verified, and export its q as QCMD and PEACHQ_Q.
author: peachq-org
branding:
  icon: download
  color: orange

inputs:
  version:
    description: >-
      The peachq to install: an exact build such as 0.92.20261115 (recommended), a release tag such as v0.92,
      or latest. Required, so a workflow never changes engine without a commit.
    required: true
  dist-url:
    description: >-
      Download from https://peachq.org/file, or from your own mirror with its flat layout
      (<dist-url>/peachq-v<version>-<platform>.tar.gz and .sha256), instead of GitHub Releases.
    required: false
    default: ''
  add-to-path:
    description: >-
      Put peachq's directory on PATH as `q`. Off by default so nothing mistakes peachq for another q.
    required: false
    default: 'false'

outputs:
  q-path:
    description: Absolute path of the installed q.
    value: ${{ steps.install.outputs.q-path }}
  version:
    description: The installed build, as .pq.version reports it (e.g. 0.92.20261115).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIST: ${{ inputs.dist-url }}
      run: |
        [ -n "$VERSION" ] || { echo "::error::setup-peachq: the version input is required"; exit 1; }
        exact=false
        [[ $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]{8}$ ]] && exact=true
        src=$(printf '%s' "${DIST:-github}" | { sha256sum 2> /dev/null || shasum -a 256; } | cut -c1-12)
        {
          echo "exact=$exact"
          echo "dir=$RUNNER_TOOL_CACHE/peachq/$VERSION/$RUNNER_OS-$RUNNER_ARCH"
          echo "key=setup-peachq-1-$VERSION-$RUNNER_OS-$RUNNER_ARCH-$src"
        } >> "$GITHUB_OUTPUT"

    # Only an exact build is cached: a tag or latest can move, so it is always fetched afresh.
    - if: steps.plan.outputs.exact == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.dir }}
        key: ${{ steps.plan.outputs.key }}

    - id: install
      shell: bash
      env:
        PEACHQ_VERSION: ${{ inputs.version }}
        PEACHQ_DIST_URL: ${{ inputs.dist-url }}
        PEACHQ_INSTALL_DIR: ${{ steps.plan.outputs.dir }}
        ADD_TO_PATH: ${{ inputs.add-to-path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        q=$("$GITHUB_ACTION_PATH/install.sh")
        version=$(sed -n 's/^version=//p' "$(dirname "$q")/.peachq-install")
        echo "q-path=$q" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        { echo "QCMD=$q"; echo "PEACHQ_Q=$q"; } >> "$GITHUB_ENV"
        [ "$ADD_TO_PATH" != true ] || dirname "$q" >> "$GITHUB_PATH"
        echo "peachq $version: $q"
